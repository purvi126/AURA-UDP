<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Readable Packet Tracer verification guide</title>
  <desc id="desc">A redrawn explanation of two observed checks. PC0 loaded Server0's HTTP page through Router0 and Router1. The tablet's Home Gateway device list showed registered temperature and smoke sensors. Original Packet Tracer captures are linked in the README.</desc>
  <rect width="900" height="500" rx="22" fill="#f5f2eb"/>
  <text x="30" y="47" fill="#163b43" font-family="Arial,sans-serif" font-size="29" font-weight="700">Cisco Packet Tracer: what was checked</text>
  <text x="30" y="76" fill="#465e62" font-family="Arial,sans-serif" font-size="18">Readable explanation of the small original captures</text>

  <rect x="30" y="101" width="840" height="167" rx="17" fill="#fffefa" stroke="#b8cfc7" stroke-width="2"/>
  <rect x="48" y="119" width="118" height="32" rx="16" fill="#dceee8"/>
  <text x="63" y="141" fill="#075f5d" font-family="Arial,sans-serif" font-size="17" font-weight="700">CHECK 01</text>
  <text x="184" y="143" fill="#163b43" font-family="Arial,sans-serif" font-size="24" font-weight="700">Routed HTTP works</text>
  <text x="50" y="187" fill="#20343a" font-family="Arial,sans-serif" font-size="22" font-weight="700">PC0  →  Router0  →  Router1  →  Server0</text>
  <text x="50" y="218" fill="#465e62" font-family="Arial,sans-serif" font-size="18">Sensor LAN: 10.10.10.11</text>
  <text x="466" y="218" fill="#465e62" font-family="Arial,sans-serif" font-size="18">HTTP page: 10.10.30.10</text>
  <text x="50" y="248" fill="#075f5d" font-family="Arial,sans-serif" font-size="19" font-weight="700">Observed: the custom page loaded in PC0's browser.</text>

  <rect x="30" y="283" width="840" height="168" rx="17" fill="#fffefa" stroke="#d0c4e0" stroke-width="2"/>
  <rect x="48" y="301" width="118" height="32" rx="16" fill="#e9e3f3"/>
  <text x="63" y="323" fill="#604688" font-family="Arial,sans-serif" font-size="17" font-weight="700">CHECK 02</text>
  <text x="184" y="325" fill="#163b43" font-family="Arial,sans-serif" font-size="24" font-weight="700">Native IoT devices registered</text>
  <text x="50" y="367" fill="#20343a" font-family="Arial,sans-serif" font-size="21" font-weight="700">Temperature Monitor + Smoke Detector</text>
  <text x="50" y="398" fill="#465e62" font-family="Arial,sans-serif" font-size="18">Home Gateway (192.168.25.1)  →  Tablet PC0 device view</text>
  <text x="50" y="430" fill="#604688" font-family="Arial,sans-serif" font-size="19" font-weight="700">Observed: both devices and their fields appeared.</text>

  <text x="30" y="480" fill="#465e62" font-family="Arial,sans-serif" font-size="17">NS2 runs the AURA transport experiment separately; this image shows Packet Tracer checks.</text>
</svg>
