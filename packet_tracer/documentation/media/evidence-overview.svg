<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="472" viewBox="0 0 1080 472" role="img" aria-labelledby="title desc">
  <title id="title">Packet Tracer verification overview</title>
  <desc id="desc">Two verified paths: sensor-side PC0 loaded the HTTP page from Server0 through Router0 and Router1; Tablet PC0 showed registered temperature and smoke sensors on the Home Gateway.</desc>
  <rect width="1080" height="472" rx="22" fill="#f5f2eb"/>
  <text x="36" y="57" fill="#163b43" font-family="Arial,sans-serif" font-size="28" font-weight="700">What the Packet Tracer file verifies</text>
  <text x="36" y="86" fill="#52666b" font-family="Arial,sans-serif" font-size="16">A readable guide to the saved screenshots · connectivity evidence, not NS2 performance</text>
  <rect x="36" y="111" width="494" height="284" rx="17" fill="#fffefa" stroke="#cad8d3" stroke-width="2"/>
  <rect x="550" y="111" width="494" height="284" rx="17" fill="#fffefa" stroke="#cad8d3" stroke-width="2"/>
  <rect x="54" y="129" width="92" height="30" rx="15" fill="#dceee8"/>
  <text x="70" y="150" fill="#075f5d" font-family="Arial,sans-serif" font-size="13" font-weight="700">CHECK 01</text>
  <text x="54" y="199" fill="#163b43" font-family="Arial,sans-serif" font-size="24" font-weight="700">Routed HTTP page</text>
  <text x="54" y="231" fill="#52666b" font-family="Arial,sans-serif" font-size="16">PC0 browser → Router0 → Router1 → Server0</text>
  <path d="M73 274 H470" stroke="#b8cfc7" stroke-width="4"/>
  <circle cx="75" cy="274" r="12" fill="#b45a32"/>
  <circle cx="261" cy="274" r="12" fill="#68549b"/>
  <circle cx="469" cy="274" r="12" fill="#087b78"/>
  <text x="55" y="309" fill="#20343a" font-family="Arial,sans-serif" font-size="15" font-weight="700">PC0</text>
  <text x="225" y="309" fill="#20343a" font-family="Arial,sans-serif" font-size="15" font-weight="700">Two routers</text>
  <text x="429" y="309" fill="#20343a" font-family="Arial,sans-serif" font-size="15" font-weight="700">Server0</text>
  <text x="54" y="348" fill="#075f5d" font-family="Arial,sans-serif" font-size="17" font-weight="700">HTTP page loaded at 10.10.30.10</text>
  <rect x="568" y="129" width="92" height="30" rx="15" fill="#e9e3f3"/>
  <text x="584" y="150" fill="#68549b" font-family="Arial,sans-serif" font-size="13" font-weight="700">CHECK 02</text>
  <text x="568" y="199" fill="#163b43" font-family="Arial,sans-serif" font-size="24" font-weight="700">Native IoT registration</text>
  <text x="568" y="231" fill="#52666b" font-family="Arial,sans-serif" font-size="16">Tablet PC0 → Home Gateway at 192.168.25.1</text>
  <rect x="568" y="253" width="458" height="51" rx="9" fill="#e7f3ee"/>
  <circle cx="589" cy="279" r="7" fill="#087b78"/>
  <text x="606" y="285" fill="#20343a" font-family="Arial,sans-serif" font-size="17" font-weight="700">TEMP-SENSOR</text>
  <text x="849" y="284" fill="#52666b" font-family="Arial,sans-serif" font-size="14">Temperature field</text>
  <rect x="568" y="315" width="458" height="51" rx="9" fill="#f3eae4"/>
  <circle cx="589" cy="341" r="7" fill="#b45a32"/>
  <text x="606" y="347" fill="#20343a" font-family="Arial,sans-serif" font-size="17" font-weight="700">SMOKE-SENSOR</text>
  <text x="850" y="346" fill="#52666b" font-family="Arial,sans-serif" font-size="14">Alarm / level fields</text>
  <rect x="36" y="414" width="1008" height="37" rx="9" fill="#163b43"/>
  <text x="54" y="439" fill="#eef8f3" font-family="Arial,sans-serif" font-size="15">AURA transport is evaluated in NS2. Packet Tracer demonstrates the campus network and device registration.</text>
</svg>
