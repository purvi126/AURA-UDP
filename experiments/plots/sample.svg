<text x="150" y="137" fill="#607176" font-family="Arial,sans-serif" font-size="13">Scale: 0–100%</text>
<text x="450" y="115" fill="#20343a" font-family="Arial,sans-serif" font-size="16" font-weight="700">On-time critical (DDR)</text>
<text x="450" y="137" fill="#607176" font-family="Arial,sans-serif" font-size="13">Scale: 0–100%</text>
<text x="750" y="115" fill="#20343a" font-family="Arial,sans-serif" font-size="16" font-weight="700">Extra sends / message</text>
<text x="750" y="137" fill="#607176" font-family="Arial,sans-serif" font-size="13">Scale: 0–1</text>
