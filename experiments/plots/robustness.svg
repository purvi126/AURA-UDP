<text x="47" y="673" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#163b43">Two-flow tight deadline</text>
<text x="291" y="673" font-family="Arial,sans-serif" font-size="14" fill="#52666b">120 messages · two CBR flows · queue 6</text>
<text x="47" y="702" font-family="Arial,sans-serif" font-size="14" fill="#20343a">One-shot</text>
<rect x="260" y="685" width="620" height="20" rx="5" fill="#e9eeeb"/>
<rect x="260" y="685" width="141.2" height="20" rx="5" fill="#b45a32"/>
<text x="896" y="701" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#20343a">22.8%</text>
<text x="47" y="732" font-family="Arial,sans-serif" font-size="14" fill="#20343a">Selective Repeat</text>
<rect x="260" y="715" width="620" height="20" rx="5" fill="#e9eeeb"/>
<rect x="260" y="715" width="26.2" height="20" rx="5" fill="#68549b"/>
<text x="896" y="731" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#20343a">4.2%</text>
<text x="47" y="762" font-family="Arial,sans-serif" font-size="14" fill="#20343a">AURA</text>
<rect x="260" y="745" width="620" height="20" rx="5" fill="#e9eeeb"/>
<rect x="260" y="745" width="26.9" height="20" rx="5" fill="#087b78"/>
<text x="896" y="761" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#20343a">4.3%</text>
<text x="47" y="792" font-family="Arial,sans-serif" font-size="14" fill="#20343a">AURA without feasibility</text>
<rect x="260" y="775" width="620" height="20" rx="5" fill="#e9eeeb"/>
<rect x="260" y="775" width="26.9" height="20" rx="5" fill="#61747a"/>
<text x="896" y="791" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#20343a">4.3%</text>
<text x="30" y="852" font-family="Arial,sans-serif" font-size="14" fill="#52666b">Two-flow cases show congestion limits. The feasibility rule saves some retries but has no established DDR gain.</text>
