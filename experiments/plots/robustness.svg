<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="876" viewBox="0 0 1060 876" role="img" aria-labelledby="title desc">
<title id="title">Long-workload deadline delivery comparison</title>
<desc id="desc">Fixed-scale bars compare timely critical-alert delivery for one-shot, Selective Repeat, AURA, and AURA without feasibility across four 120-message conditions and 30 seeds each. AURA falls below one-shot under two-flow congestion.</desc>
<rect width="1060" height="876" fill="#f5f2eb"/>
<text x="30" y="43" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#163b43">Longer runs reveal where AURA helps—and where it does not</text>
<text x="30" y="73" font-family="Arial,sans-serif" font-size="16" fill="#52666b">Critical alerts delivered before deadline (DDR) · 30 fresh seeds per condition · fixed 0–100% scale</text>
<rect x="28" y="94" width="1004" height="173" rx="13" fill="#fffefa" stroke="#d7dedb"/>
<text x="47" y="121" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#163b43">Long moderate</text>
<text x="291" y="121" font-family="Arial,sans-serif" font-size="14" fill="#52666b">120 messages · one CBR flow · queue 12</text>
<text x="47" y="150" font-family="Arial,sans-serif" font-size="14" fill="#20343a">One-shot</text>
<rect x="260" y="133" width="620" height="20" rx="5" fill="#e9eeeb"/>
<rect x="260" y="133" width="528.4" height="20" rx="5" fill="#b45a32"/>
<text x="896" y="149" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#20343a">85.2%</text>
<text x="47" y="180" font-family="Arial,sans-serif" font-size="14" fill="#20343a">Selective Repeat</text>
<rect x="260" y="163" width="620" height="20" rx="5" fill="#e9eeeb"/>
<rect x="260" y="163" width="524.2" height="20" rx="5" fill="#68549b"/>
<text x="896" y="179" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#20343a">84.6%</text>
<text x="47" y="210" font-family="Arial,sans-serif" font-size="14" fill="#20343a">AURA</text>
<rect x="260" y="193" width="620" height="20" rx="5" fill="#e9eeeb"/>
<rect x="260" y="193" width="604.2" height="20" rx="5" fill="#087b78"/>
<text x="896" y="209" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#20343a">97.4%</text>
<text x="47" y="240" font-family="Arial,sans-serif" font-size="14" fill="#20343a">AURA without feasibility</text>
<rect x="260" y="223" width="620" height="20" rx="5" fill="#e9eeeb"/>
<rect x="260" y="223" width="605.5" height="20" rx="5" fill="#61747a"/>
<text x="896" y="239" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#20343a">97.7%</text>
<rect x="28" y="278" width="1004" height="173" rx="13" fill="#fffefa" stroke="#d7dedb"/>
<text x="47" y="305" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#163b43">Long high rate</text>
<text x="291" y="305" font-family="Arial,sans-serif" font-size="14" fill="#52666b">120 messages · one CBR flow · queue 12</text>
<text x="47" y="334" font-family="Arial,sans-serif" font-size="14" fill="#20343a">One-shot</text>
<rect x="260" y="317" width="620" height="20" rx="5" fill="#e9eeeb"/>
<rect x="260" y="317" width="530.4" height="20" rx="5" fill="#b45a32"/>
<text x="896" y="333" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#20343a">85.6%</text>
<text x="47" y="364" font-family="Arial,sans-serif" font-size="14" fill="#20343a">Selective Repeat</text>
<rect x="260" y="347" width="620" height="20" rx="5" fill="#e9eeeb"/>
<rect x="260" y="347" width="167.4" height="20" rx="5" fill="#68549b"/>
<text x="896" y="363" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#20343a">27.0%</text>
<text x="47" y="394" font-family="Arial,sans-serif" font-size="14" fill="#20343a">AURA</text>
