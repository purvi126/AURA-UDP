<text x="47" y="489" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#163b43">Two-flow congestion</text>
<text x="291" y="489" font-family="Arial,sans-serif" font-size="14" fill="#52666b">120 messages · two CBR flows · queue 6</text>
<text x="47" y="518" font-family="Arial,sans-serif" font-size="14" fill="#20343a">One-shot</text>
<rect x="260" y="501" width="620" height="20" rx="5" fill="#e9eeeb"/>
<rect x="260" y="501" width="418.2" height="20" rx="5" fill="#b45a32"/>
