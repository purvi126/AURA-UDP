<text x="47" y="548" font-family="Arial,sans-serif" font-size="14" fill="#20343a">Selective Repeat</text>
<rect x="260" y="531" width="620" height="20" rx="5" fill="#e9eeeb"/>
<rect x="260" y="531" width="42.0" height="20" rx="5" fill="#68549b"/>
<text x="896" y="547" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#20343a">6.8%</text>
