name: Python checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install NS2 for integration tests
        run: sudo apt-get update && sudo apt-get install -y ns2
      - run: python -m compileall -q python scripts tests
      - run: python -m unittest discover -s tests -v
      - run: node scripts/check_dashboard.mjs
      - name: Check reproducible ablation diagram
        run: python scripts/plot_ablation.py && git diff --exit-code -- experiments/plots/ablation.svg
      - name: Check reproducible long-workload diagram
        run: python scripts/plot_robustness.py && git diff --exit-code -- experiments/plots/robustness.svg
      - name: Smoke-test the seed sweep
        run: python scripts/multiseed.py --seeds 3 --output /tmp/aura-ci-sweep
      - name: Smoke-test deadline policy ablations
        run: python scripts/ablation.py --seeds 3 --output /tmp/aura-ci-ablation
      - name: Smoke-test longer and competing-flow workloads
        run: python scripts/robustness.py --seeds 2 --output /tmp/aura-ci-robustness
      - name: Smoke-test reserved alert admission
        run: python scripts/reservation_study.py --seeds 2 --output /tmp/aura-ci-reservation
      - name: Smoke-test burst and link-rate sensitivity
        run: python scripts/sensitivity.py --seeds 2 --output /tmp/aura-ci-sensitivity
